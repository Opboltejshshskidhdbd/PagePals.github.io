name: Extract Roblox Luau ZIP

on:
  workflow_dispatch:  # manual run
  push:
    branches: [main]

jobs:
  extract:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check zip file exists
        run: |
          ls -l
          test -f roblox-luau-assistant-1.12.0-gate.zip

      - name: Extract ZIP
        run: |
          mkdir -p extracted
          unzip -o roblox-luau-assistant-1.12.0-gate.zip -d extracted/
          find extracted -maxdepth 3 -type f | head -200

      - name: Show extracted structure
        run: |
          find extracted -maxdepth 3 -type d | sort

      - name: Commit extracted files
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add extracted
          git diff --cached --quiet || git commit -m "Extract Roblox Luau assistant ZIP"
          git push
