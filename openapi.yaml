openapi: 3.1.0
info: {title: Luau Validator, version: "1.0"}
servers: [{url: "https://luau-validator.YOURNAME.workers.dev"}]
paths:
  /validate:
    post:
      operationId: validateLuau
      summary: Validate Roblox Luau code (syntax, scopes, Roblox API checks)
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [code], properties: {code: {type: string}}}
      responses:
        "200": {description: Validation result, content: {application/json: {schema: {type: object}}}}
