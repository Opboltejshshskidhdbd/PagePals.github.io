<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Luau Validator Pro</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--card:#f4f4f6;--bd:#d8d8de;--mut:#777;--err:#c62828;--warn:#b26a00;--info:#1565c0;--ok:#2e7d32}
@media(prefers-color-scheme:dark){:root{--bg:#14151a;--fg:#e8e8ec;--card:#1e2028;--bd:#33353f;--mut:#9a9aa5;--err:#ff6b6b;--warn:#ffb74d;--info:#64b5f6;--ok:#66bb6a}}
*{box-sizing:border-box}
body{margin:0 auto;max-width:960px;padding:14px;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,sans-serif}
h1{font-size:19px;margin:0 0 10px}
.ed{display:flex;border:1px solid var(--bd);border-radius:8px;background:var(--card);height:320px;overflow:hidden}
#g,#src{font:13px/18px ui-monospace,Consolas,monospace;padding:8px 0;margin:0}
#g{width:44px;overflow:hidden;text-align:right;color:var(--mut);border-right:1px solid var(--bd);user-select:none;flex:none}
#g div{padding-right:6px}#g .e{background:var(--err);color:#fff}#g .w{background:var(--warn);color:#fff}
#src{flex:1;border:0;outline:0;resize:none;background:transparent;color:var(--fg);padding:8px 10px;white-space:pre;overflow:auto}
button{background:var(--fg);color:var(--bg);border:0;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;margin:8px 6px 0 0}
.chips{margin:10px 0;display:flex;gap:6px;flex-wrap:wrap}.chip{background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:2px 10px;font-size:12px}
.i{border-left:3px solid;padding:6px 10px;margin:5px 0;background:var(--card);border-radius:0 6px 6px 0;cursor:pointer}
.i small{color:var(--mut)}.error{border-color:var(--err)}.warning{border-color:var(--warn)}.info{border-color:var(--info)}.ok{border-color:var(--ok)}
details{margin-top:10px}pre.j{overflow:auto;background:var(--card);padding:10px;border-radius:8px;font-size:12px;max-height:260px}
</style></head><body>
<h1>Roblox Luau Validator Pro</h1>
<div class="ed"><pre id="g"></pre><textarea id="src" spellcheck="false" wrap="off" placeholder="Luau code paste karo — live validate hota hai"></textarea></div>
<button id="sample">Sample</button><button id="share">Share link</button><button id="cp">Copy JSON</button>
<div class="chips" id="chips"></div><div id="out"></div>
<details><summary>JSON output (API format)</summary><pre class="j" id="json"></pre></details>
<script type="application/json" id="result"></script>
<script type="module">
import{validate}from"./luau-core.js";
const $=id=>document.getElementById(id);
let RULES=[],timer;
const SAMPLE=`--!strict
local Players = game:GetService("Playerz")
local unused = 5
type Cfg = {speed: number, name: string?}

local function greet(p: Player, cfg: Cfg): string
	return \`Hello {p.Name}\`
end

while true do
	local part = Instance.new("Prat")
	part.Parent = workspace
end

Players.PlayerAdded:connect(function(plr)
	counter += 1
	score = 10
	print(greet(plr, {speed = 1, name = nil}))
end)
`;
function run(){
  const src=$("src").value,res=validate(src,RULES),o=$("out");
  o.textContent="";
  const add=(cls,txt,it)=>{const d=document.createElement("div");d.className="i "+cls;
    d.append(it?`Line ${it.line}:${it.col||1} — `:"",txt);
    if(it&&it.rule){const s=document.createElement("small");s.textContent="  ["+it.rule+"]";d.append(s)}
    if(it)d.onclick=()=>jump(it);o.append(d)};
  if(!res.errors.length)add("ok",res.warnings.length?"Syntax OK — warnings neeche hain.":"Sab clean hai.");
  res.errors.forEach(e=>add("error",e.message,e));
  res.warnings.forEach(w=>add(w.severity==="info"?"info":"warning",w.message,w));
  const s=res.stats;
  $("chips").textContent="";
  [`${res.errors.length} errors`,`${res.warnings.length} warnings`,`${s.lines} lines`,`${s.functions} functions`,`${s.locals} locals`,`max depth ${s.maxDepth}`].forEach(t=>{const c=document.createElement("span");c.className="chip";c.textContent=t;$("chips").append(c)});
  const bad=new Map();res.warnings.forEach(w=>bad.set(w.line,"w"));res.errors.forEach(e=>bad.set(e.line,"e"));
  gutter(s.lines,bad);
  const j=JSON.stringify(res,null,2);$("json").textContent=j;$("result").textContent=j;window.__RESULT__=res;
}
function gutter(n,bad){const g=$("g");g.textContent="";for(let i=1;i<=n;i++){const d=document.createElement("div");d.textContent=i;if(bad.has(i))d.className=bad.get(i);g.append(d)}g.scrollTop=$("src").scrollTop}
function jump(it){
  const t=$("src"),lines=t.value.split("\n");
  let off=0;for(let i=0;i<it.line-1;i++)off+=lines[i].length+1;
  off+=(it.col||1)-1;t.focus();t.setSelectionRange(off,off+1);t.scrollTop=Math.max(0,(it.line-4)*18)}
const sched=()=>{clearTimeout(timer);timer=setTimeout(run,250)};
$("src").addEventListener("input",sched);
$("src").addEventListener("scroll",()=>{$("g").scrollTop=$("src").scrollTop});
$("sample").onclick=()=>{$("src").value=SAMPLE;run()};
$("cp").onclick=()=>navigator.clipboard&&navigator.clipboard.writeText($("json").textContent);
$("share").onclick=()=>{
  const b=new TextEncoder().encode($("src").value);let s="";for(const x of b)s+=String.fromCharCode(x);
  const u=location.origin+location.pathname+"?code="+btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  navigator.clipboard&&navigator.clipboard.writeText(u);$("share").textContent="Link copied";setTimeout(()=>$("share").textContent="Share link",1500)};
window.validateLuau=c=>validate(c,RULES);
fetch("rules.json").then(r=>r.json()).then(j=>{RULES=j.rules}).catch(()=>{}).finally(()=>{
  const c=new URLSearchParams(location.search).get("code");
  if(c){try{const b=atob(c.replace(/-/g,"+").replace(/_/g,"/"));$("src").value=new TextDecoder().decode(Uint8Array.from(b,x=>x.charCodeAt(0)))}catch{}}
  run()});
</script></body></html>
